name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t snipvault:ci .
      - name: Smoke test
        run: |
          docker run -d --name sv -p 3000:3000 snipvault:ci
          for i in $(seq 1 15); do curl -fs localhost:3000/health && exit 0; sleep 1; done
          docker logs sv
          exit 1
